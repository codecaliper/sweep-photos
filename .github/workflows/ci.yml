name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Static checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install e2e dependencies (Chrome for Testing)
        run: npm ci
        working-directory: e2e
      - name: End-to-end tests against the Google Photos mock
        run: npm run e2e
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-photos-extension
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag matches manifest version
        run: test "v$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Sweep for Google Photos $GITHUB_REF_NAME" --generate-notes
